events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # --------------------------------------------------------------------------
    # IP-based Rate Limiting Zones (Shared Memory: 10MB holds ~160,000 unique IPs)
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=100r/s;

    upstream redirect_service {
        server redirect:8082;
    }

    upstream apigateway_service {
        server apigateway:8080;
    }

    # ==========================================================================
    # 1. DEDICATED REDIRECT DOMAIN (Matches any r.* e.g. r.localhost, r.mydomain.com)
    #    All link redirection exclusively handled here.
    # ==========================================================================
    server {
        listen 80;
        server_name ~^r\.(?<main_domain>.+)$;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting on redirection
        limit_req zone=redirect_limit burst=150 nodelay;
        limit_req_status 429;

        # Custom JSON error response for rate-limited requests
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Too many requests. Please wait a moment and try again.","status":429}\n';
        }

        # Root visiting (r.domain/) -> dynamically redirect to main parent domain
        location = / {
            return 302 $scheme://$main_domain/;
        }

        # Direct short code & custom alias redirection: http://r.{domain}/{shortCode}
        location / {
            proxy_pass http://redirect_service/r/;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }

    # ==========================================================================
    # 2. MAIN APPLICATION & API GATEWAY (Catch-all for any domain or IP)
    #    Web UI & API Gateway exclusively handled here (no /r or /s).
    # ==========================================================================
    server {
        listen 80 default_server;
        server_name _ localhost;

        root /usr/share/nginx/html;
        index index.html;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Custom JSON error response for rate-limited requests
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Too many requests. Please wait a moment and try again.","status":429}\n';
        }

        # Block access to hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # 1. Backend APIs (routed through API Gateway)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://apigateway_service;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # 2. Static asset caching for React client
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # 3. React SPA client fallback (serves index.html for client-side routing)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
