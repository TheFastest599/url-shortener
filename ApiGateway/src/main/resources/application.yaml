server:
  port: 8080

spring:
  application:
    name: url-gateway-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/url_shortener_auth
    username: postgres
    password: postgres_password
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/url_shortener_auth
    user: postgres
    password: postgres_password
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
