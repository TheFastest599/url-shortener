server:
  port: ${PORT:8080}

debug: false

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

# ==============================================================================
# DEFAULT PROFILE: Local Development (Host Machine)
# ==============================================================================
spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: core-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/urls/**, /api/v1/campaigns/**, /api/v1/ab-tests/**

        - id: analytics-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/analytics/**

        - id: redirect-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/r/**, /s/**
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortener_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_password}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortener_auth}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_password}
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 20
    connect-retries-interval: 2s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  frontend-url: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyWhichIsAtLeast32BytesLongForHS256BitSecurity!}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

oauth:
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:google-client-id-fallback}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:google-client-secret-fallback}
    redirect-uri: http://localhost:8080/api/v1/auth/oauth2/google/callback
  github:
    client-id: ${OAUTH_GITHUB_CLIENT_ID:github-client-id-fallback}
    client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:github-client-secret-fallback}
    redirect-uri: http://localhost:8080/api/v1/auth/oauth2/github/callback

---
# ==============================================================================
# DOCKER PROFILE: Production Container Network (Activated via SPRING_PROFILES_ACTIVE=docker)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: core-service-route
          uri: http://core:8081
          predicates:
            - Path=/api/v1/urls/**, /api/v1/campaigns/**, /api/v1/ab-tests/**

        - id: analytics-service-route
          uri: http://analytics:8083
          predicates:
            - Path=/api/v1/analytics/**

        - id: redirect-service-route
          uri: http://redirect:8082
          predicates:
            - Path=/r/**, /s/**
  r2dbc:
    url: r2dbc:postgresql://postgres:${DB_PORT:5432}/${DB_NAME:url_shortener_auth}
  flyway:
    url: jdbc:postgresql://postgres:${DB_PORT:5432}/${DB_NAME:url_shortener_auth}
  data:
    redis:
      host: redis
      port: ${REDIS_PORT:6379}

app:
  frontend-url: http://localhost

oauth:
  google:
    redirect-uri: http://localhost/api/v1/auth/oauth2/google/callback
  github:
    redirect-uri: http://localhost/api/v1/auth/oauth2/github/callback
