server:
  port: 8081

spring:
  application:
    name: url-core-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hiclickme_core
    username: core_user
    password: core_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: 9a4f2c8d3e7b1a5f6c8d9e0a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
