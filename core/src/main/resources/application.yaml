server:
  port: 8081

grpc:
  server:
    port: 9090

spring:
  application:
    name: url-core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hiclickme_core
    username: core_user
    password: core_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
